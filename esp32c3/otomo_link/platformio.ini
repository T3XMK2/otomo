; otomo_link: the cat's HOME on an ESP32-C3 SuperMini - its brain, its learning and its site; it joins the home Wi-Fi
; and answers the in-game plugin (the body) over UDP 7777. Its USB-C = the serial console.
;   pio run -t upload          the firmware          pio device monitor      the console
;   pio run -t uploadfs        the file system (data/: the site + the game's lists; no cat - a brain is born in game)
[env:c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
board_build.filesystem = littlefs
lib_deps = bblanchon/ArduinoJson@^7
